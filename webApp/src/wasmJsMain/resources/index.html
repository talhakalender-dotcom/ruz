<!doctype html>
<html lang="tr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Ruz · deneme</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #F8F7F4; }
        /* Dokunmatik hareketler (kaydırma, iki parmakla yakınlaştırma) tarayıcıya değil uygulamaya gitsin;
           yoksa tarayıcı sayfayı kaydırmaya çalışır ve Gantt ancak basılı tutunca kayar. */
        html, body, body * { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
        /* Uygulama açılınca üstüne çizilir. */
        #yukleniyor { position: fixed; inset: 0; z-index: -1; font-family: sans-serif; color: #1E5A6B; display: flex;
                      align-items: center; justify-content: center; }
    </style>
    <script type="application/javascript" src="webApp.js"></script>
</head>

</body>
