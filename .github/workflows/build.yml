name: APK derle

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.3"

      - name: İmza anahtarını hazırla
        env:
          KEY_B64: ${{ secrets.RUZ_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/ruz.p12"
            echo "RUZ_KEYSTORE=$RUNNER_TEMP/ruz.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::İmza anahtarı tanımlı değil; bu APK geçici bir imzayla derleniyor."
          fi

      - name: Test et ve derle
        env:
          RUZ_KEYSTORE_PASSWORD: ${{ secrets.RUZ_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :shared:allTests :androidApp:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Hataları göster
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Exception|FAILED" -A3 build.log | head -120 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done

      - name: Derleme kaydını ekle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log

      - name: APK'yı ekle
        uses: actions/upload-artifact@v4
        with:
          name: Ruz-${{ github.run_number }}
          path: androidApp/build/outputs/apk/release/*.apk

      - name: APK'yı yayınla
        if: github.ref == 'refs/heads/main' && env.RUZ_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk Ruz.apk
          gh release delete son --yes --cleanup-tag || true
          gh release create son Ruz.apk --title "Ruz (son sürüm #${{ github.run_number }})" --notes "Otomatik derleme #${{ github.run_number }}" --target ${{ github.sha }}
